name: Release Automation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-version:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.message, 'bump')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Detect bump type
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -q "BREAKING CHANGE\|!:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -q "feat:\|feature:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -q "fix:\|bugfix:"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
      
      - name: Bump version
        id: version
        run: |
          python3 scripts/bump_version.py ${{ steps.bump.outputs.type }}
          echo "new_version=$(cat VERSION)" >> $GITHUB_OUTPUT
      
      - name: Commit version
        run: |
          git add VERSION
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
      
      - name: Create tag
        run: |
          git tag -a v${{ steps.version.outputs.new_version }} -m "Release v${{ steps.version.outputs.new_version }}"
      
      - name: Push
        run: |
          git push origin main
          git push origin v${{ steps.version.outputs.new_version }}